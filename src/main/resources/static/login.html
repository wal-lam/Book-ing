<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 | Book-ing</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <main class="auth-page">
        <div class="auth-box">
            <h1 class="auth-title">Book-ing</h1>
            <p class="auth-desc">열람실 좌석 예약</p>

            <form id="login-form" method="post">
                <div class="form-group">
                    <label class="form-label" for="loginId">아이디</label>
                    <input class="form-input" type="text" id="loginId" name="loginId" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">비밀번호</label>
                    <input class="form-input" type="password" id="password" name="password" autocomplete="current-password" required>
                </div>

                <p class="form-error" id="login-error" hidden></p>

                <button class="btn btn-primary btn-block" type="submit">로그인</button>
            </form>

            <p class="auth-link">
                계정이 없으신가요? <a href="/signup.html">회원가입</a>
            </p>
        </div>
    </main>

    <script src="/js/common.js"></script>
    <script src="/js/login.js"></script>
</body>
</html>
