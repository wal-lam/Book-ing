<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 | Book-ing</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <main class="auth-page">
        <div class="auth-box">
            <h1 class="auth-title">회원가입</h1>
            <p class="auth-desc">Book-ing 열람실 좌석 예약</p>

            <form id="signup-form">
                <div class="form-group">
                    <label class="form-label" for="loginId">아이디</label>
                    <input class="form-input" type="text" id="loginId" name="loginId" autocomplete="username" aria-describedby="loginId-hint" required>
                    <p class="form-hint" id="loginId-hint">영문, 숫자 4~20자</p>
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">비밀번호</label>
                    <input class="form-input" type="password" id="password" name="password" autocomplete="new-password" aria-describedby="password-hint" required>
                    <p class="form-hint" id="password-hint">8~20자</p>
                </div>
                <div class="form-group">
                    <label class="form-label" for="passwordConfirm">비밀번호 확인</label>
                    <input class="form-input" type="password" id="passwordConfirm" name="passwordConfirm" autocomplete="new-password" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="name">이름</label>
                    <input class="form-input" type="text" id="name" name="name" autocomplete="name" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="email">이메일</label>
                    <input class="form-input" type="email" id="email" name="email" autocomplete="email" required>
                </div>

                <p class="form-error" id="signup-error" hidden></p>

                <button class="btn btn-primary btn-block" type="submit">가입하기</button>
            </form>

            <p class="auth-link">
                이미 계정이 있으신가요? <a href="/login.html">로그인</a>
            </p>
        </div>
    </main>

    <script src="/js/common.js"></script>
    <script src="/js/signup.js"></script>
</body>
</html>
